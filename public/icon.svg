<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="none" stroke="url(#primaryGrad)" stroke-width="4" opacity="0.4" />

  <!-- Graph Connection Lines -->
  <g stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="120" x2="150" y2="230" />
    <line x1="256" y1="120" x2="362" y2="230" />
    <line x1="150" y1="230" x2="190" y2="370" />
    <line x1="362" y1="230" x2="322" y2="370" />
    <line x1="190" y1="370" x2="322" y2="370" />
    <line x1="150" y1="230" x2="362" y2="230" stroke-dasharray="8 8" opacity="0.6" />
    <line x1="256" y1="120" x2="256" y2="290" />
    <line x1="256" y1="290" x2="190" y2="370" />
    <line x1="256" y1="290" x2="322" y2="370" />
  </g>

  <!-- Glowing Central AI Core Node -->
  <circle cx="256" cy="290" r="34" fill="url(#primaryGrad)" filter="url(#glow)" />
  <circle cx="256" cy="290" r="22" fill="#ffffff" />

  <!-- Code Bracket Symbols inside Central Core -->
  <path d="M 248 282 L 240 290 L 248 298 M 264 282 L 272 290 L 264 298" 
        fill="none" stroke="#4f46e5" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Surrounding Graph Nodes -->
  <circle cx="256" cy="120" r="24" fill="#6366f1" />
  <circle cx="256" cy="120" r="12" fill="#ffffff" />

  <circle cx="150" cy="230" r="20" fill="#38bdf8" />
  <circle cx="150" cy="230" r="10" fill="#ffffff" />

  <circle cx="362" cy="230" r="20" fill="#a855f7" />
  <circle cx="362" cy="230" r="10" fill="#ffffff" />

  <circle cx="190" cy="370" r="22" fill="#10b981" />
  <circle cx="190" cy="370" r="11" fill="#ffffff" />

  <circle cx="322" cy="370" r="22" fill="#f59e0b" />
  <circle cx="322" cy="370" r="11" fill="#ffffff" />
</svg>
